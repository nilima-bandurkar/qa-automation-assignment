[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html

markers =
    smoke: quick sanity checks (login / logout)
    e2e: full employee lifecycle end-to-end scenario
    api: tests that exercise the API layer

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
